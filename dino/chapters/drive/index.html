<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6e5f" />
  <title>Dino Car Studio · Dinosaur Universe</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <button id="btnHome" class="round-btn" title="Home" aria-label="Home">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 3 3 10v11h6v-7h6v7h6V10z" fill="#fff"/></svg>
    </button>
    <h1 class="title">Dino Car Studio</h1>
    <button id="btnSound" class="round-btn" title="Sound" aria-label="Toggle sound">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#fff"/><path id="soundWave" d="M16 8.5c1.5 1 1.5 6 0 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main>
    <!-- Home -->
    <section id="screen-home" class="screen">
      <div class="home-card">
        <h2 class="home-title">Let's build your dream car!</h2>
        <div class="home-buttons">
          <button id="btnPaint" class="big-btn paint">
            <span class="big-icon">🎨</span>
            <span>Paint My Car</span>
          </button>
          <button id="btnGarage" class="big-btn garage">
            <span class="big-icon">🚗</span>
            <span>Dino Garage</span>
          </button>
          <button id="btnDrive" class="big-btn drive">
            <span class="big-icon">🦖</span>
            <span>Explore & Collect</span>
          </button>
          <button id="btnRace" class="big-btn race">
            <span class="big-icon">🏁</span>
            <span>Dino Race</span>
          </button>
        </div>
        <div class="home-lower">
          <div class="home-car-summary" id="homeCarSummary"></div>
          <div class="scene-picker">
            <div class="palette-label">Choose your world</div>
            <div id="scenePicker" class="scene-picker-grid" role="group" aria-label="Choose a drive world"></div>
          </div>
        </div>
        <p class="home-hint" id="homeHint">Your dino friend is ready to drive!</p>
      </div>
    </section>

    <!-- Customization -->
    <section id="screen-customize" class="screen hidden">
      <div class="customize-stage">
        <div id="carPreview" class="car-preview" aria-label="Your car preview"></div>
        <div class="palette">
          <div class="palette-label">Pick a color</div>
          <div id="colorSwatches" class="swatches"></div>
        </div>
        <div class="palette">
          <div class="palette-label">Add stickers</div>
          <div id="stickerTray" class="sticker-tray"></div>
        </div>
        <div class="palette">
          <div class="palette-label">Your name on the car</div>
          <input id="nameInput" class="name-input" type="text" maxlength="10" placeholder="Type your name" autocomplete="off" />
        </div>
        <div class="actions">
          <button id="btnShuffle" class="action-btn">🎲 Surprise me!</button>
          <button id="btnDriveFromCustomize" class="action-btn primary">Drive now →</button>
        </div>
      </div>
    </section>

    <!-- Garage -->
    <section id="screen-garage" class="screen hidden">
      <div class="garage-stage">
        <div class="garage-heading">
          <div><p class="eyebrow">YOUR COLLECTION</p><h2>Dino Garage</h2><p id="garageProgress">Choose a car to take on an adventure.</p></div>
          <button id="btnGarageBack" class="action-btn">← Back</button>
        </div>
        <div class="garage-stats" id="garageStats"></div>
        <div id="garageGrid" class="garage-grid" aria-label="Cars in your garage"></div>
      </div>
    </section>

    <!-- Drive scene -->
    <section id="screen-drive" class="screen hidden">
      <div class="drive-stage">
        <canvas id="driveCanvas" width="960" height="540"></canvas>
        <div class="drive-hud">
          <div class="hud-pill" id="hudStars">⭐ 0</div>
          <div class="hud-pill" id="hudProgress">Island Road</div>
          <div class="hud-pill" id="hudMessage">Collect the stars!</div>
        </div>
        <div class="drive-controls">
          <button id="btnLeft" class="steer-btn" aria-label="Steer left">◀</button>
          <button id="btnRight" class="steer-btn" aria-label="Steer right">▶</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
