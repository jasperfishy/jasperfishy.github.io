<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4a8f3c" />
<title>Dino Park · Dinosaur Universe</title>
<style>
  :root { --shadow: 0 10px 30px rgba(20,40,80,.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: linear-gradient(180deg,#fff3d9,#e2f5d0); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #game-root { position: relative; overflow: hidden; width: 100%; height: 100%; max-width: 960px; max-height: 540px; margin: auto; }
  #game-root canvas { display: block; width: 100% !important; height: 100% !important; border-radius: 16px; box-shadow: var(--shadow); touch-action: none; }
  #menu-access-layer { position: absolute; left: 3.6458%; top: 17.037%; width: 92.7084%; height: 81.481%; z-index: 50; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); column-gap: 1.1236%; row-gap: 1.8182%; }
  #menu-access-layer[hidden] { display: none; }
  #menu-access-layer button { min-width: 0; border: 2px solid transparent; border-radius: 10px; background: transparent; color: transparent; cursor: pointer; }
  #menu-access-layer button:hover { background: rgba(255,255,255,.12); }
  #menu-access-layer button:focus-visible { outline: 4px solid #17403a; border-color: #ffd23f; background: rgba(255,255,255,.22); }
  #menuBack { position: absolute; top: 10px; left: 10px; z-index: 110; width: 42px; height: 38px; display: none; place-items: center; border: 2px solid rgba(23,64,58,.3); border-radius: 12px; background: rgba(255,255,255,.86); color: #17403a; font: 700 20px system-ui,sans-serif; cursor: pointer; }
  #menuBack:focus-visible { outline: 4px solid #ffd23f; }
  #hubBack {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    width: 46px; height: 46px; border: none; border-radius: 50%; text-decoration: none; color: #333;
    background: rgba(255,255,255,.6); display: grid; place-items: center;
    cursor: pointer; box-shadow: var(--shadow); font-size: 20px;
  }
  #hubBack:active { transform: scale(.92); }
</style>
</head>
<body>
<div id="stage">
  <div id="game-root">
    <div id="menu-access-layer" role="group" aria-label="Choose a Dino Park game" hidden></div>
    <button id="menuBack" type="button" aria-label="Back to Dino Park games" title="Back to Dino Park games">←</button>
  </div>
</div>
<a id="hubBack" href="../../index.html?v=du-58eb19b6b425f48c" aria-label="Back to the hub menu" title="Back to the hub menu">◀</a>
<script src="../../lib/phaser.min.js?v=du-58eb19b6b425f48c"></script>
<script src="../../fx/du-dino.js?v=du-58eb19b6b425f48c"></script>
<script src="../../fx/du-fx.js?v=du-58eb19b6b425f48c"></script>
<script src="../phaser-kit.js?v=du-58eb19b6b425f48c"></script>
<script src="main.js?v=du-58eb19b6b425f48c"></script>
<script>
  if (window.self !== window.top) document.getElementById("hubBack").style.display = "none";
  const menuBack = document.getElementById("menuBack");
  menuBack.addEventListener("pointerdown", (event) => event.stopPropagation());
  menuBack.addEventListener("click", (event) => { event.preventDefault(); event.stopPropagation(); window.parkReturnToMenu && window.parkReturnToMenu(); });
  if (window.game) window.game.events.on("poststep", () => { menuBack.style.display = window.game.scene.isActive("menu") ? "none" : "grid"; });
</script>
<script src="../../update-manager.js?v=du-58eb19b6b425f48c"></script>
</body>
</html>
