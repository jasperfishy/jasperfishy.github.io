<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Dinosaur Universe brings Dino Park, Dino Meadow and Dino Car Studio together in one place. Free, no ads, no accounts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="hub.css">
<title>Dinosaur Universe</title>
</head>
<body>
<header id="hubbar">
  <h1 id="brand">🦕 Dinosaur Universe</h1>
  <div class="tools">
    <button id="soundBtn" class="pill" aria-label="Sound">🔊</button>
    <button id="parentsBtn" class="pill" aria-label="Parents">🧑‍👧 Parents</button>
  </div>
</header>
<main id="hub"></main>
<div id="stage" hidden>
  <div id="stagebar">
    <button id="backBtn" class="pill" aria-label="Back to the menu">◀ Menu</button>
    <span id="stageTitle"></span>
  </div>
  <iframe id="chapter" title="Chapter"></iframe>
</div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="hub.js"></script>
<script>if("serviceWorker" in navigator && window.self === window.top){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){});});}</script>
</body>
</html>
